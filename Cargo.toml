[package]
name = "regos"
edition = "2024"
license-file = "LICENSE"
repository = "https://github.com/leovn85/regos"
version = "1.0.1"

[lib]
crate-type = ["cdylib"]

[dependencies]
# Lõi IL2CPP
il2cpp-runtime = { path = "il2cpp-rust/il2cpp-runtime", features = ["log"] }
sysinfo = "0.30.5"
ureq = { version = "2.9", features = ["json", "tls"] }

# Misc
ctor = "0.13.1"
log = "0.4.29"
simplelog = "0.12.2"
anyhow = "1.0.98"
serde = { version = "1.0.219", features = ["derive"] }
serde_json = "1.0.141"
chrono = { version = "0.4", features = ["serde"] }
directories = "6.0.0"
patternscan = "1.2.0"
microseh = "1.1.2"
parking_lot = "0.12"
function_name = "0.3.0"
widestring = "1.2.0"
strum = { version = "0.28", features = ["derive"] }

[dependencies.windows]
version = "0.61.3"
features = [
    "Win32_Foundation",
    "Win32_System_LibraryLoader",
    "Win32_System_Threading",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_System_ProcessStatus",
    "Win32_System_Diagnostics_Debug",
	"Win32_UI_WindowsAndMessaging",
	"Win32_System_Memory",
	"Win32_Security",
]

[build-dependencies]
winres = "0.1.12"
# serde_json = "1.0.141"
# ureq = { version = "2.9", features = ["json"] }

[profile.release]
opt-level = "z"     
lto = true          
codegen-units = 1   
panic = "abort"     
strip = true        